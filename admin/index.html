<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 - 부산 공공기관 사업공고</title>
<link rel="stylesheet" href="../style.css" />
<style>
  .login-box, .admin-panel { max-width: 480px; margin: 60px auto; padding: 20px; }
  .admin-panel { max-width: 720px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  form input, form select { padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; }
  button { padding: 10px; border: none; border-radius: 8px; background: #1a56db; color: #fff; cursor: pointer; }
  .row-actions button { background: #ef4444; padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
  th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; }
</style>
</head>
<body>
  <div id="loginBox" class="login-box">
    <h2>관리자 로그인</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="이메일" required />
      <input type="password" id="password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
    </form>
    <p id="loginError" style="color:#dc2626; font-size:13px;"></p>
  </div>

  <div id="adminPanel" class="admin-panel" style="display:none;">
    <h2>공고 수동 추가</h2>
    <form id="noticeForm">
      <input type="text" id="title" placeholder="공고명" required />
      <input type="text" id="org" placeholder="발주기관" required />
      <select id="type">
        <option value="물품">물품</option>
        <option value="공사">공사</option>
        <option value="용역">용역</option>
        <option value="기타">기타</option>
      </select>
      <input type="date" id="postedAt" />
      <input type="date" id="closeAt" />
      <input type="url" id="detailUrl" placeholder="상세 링크 (선택)" />
      <button type="submit">추가</button>
    </form>

    <table>
      <thead>
        <tr><th>공고명</th><th>기관</th><th>구분</th><th>마감일</th><th></th></tr>
      </thead>
      <tbody id="noticeTableBody"></tbody>
    </table>

    <button id="logoutBtn" style="background:#6b7280; margin-top:20px;">로그아웃</button>
  </div>

  <script type="module" src="../firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
