<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>부산 공공기관 사업공고 모니터링</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <span class="mark">⚓ Busan Procurement Watch</span>
    <h1>부산지역 공기업·공공기관 사업공고</h1>
    <p class="sub">나라장터 기반 실시간 모니터링 (자동 수집)</p>
    <a href="#allList" class="jump-link">전체 공고 목록 · 검색으로 바로가기 ↓</a>
  </header>

  <main>
    <section id="todaySection" class="highlight-section" style="display:none;">
      <h2>🔔 오늘 신규 추가</h2>
      <div id="todayList" class="notice-list"></div>
    </section>

    <section id="extendedSection" class="highlight-section" style="display:none;">
      <h2>📌 기간 연장 공고</h2>
      <div id="extendedList" class="notice-list"></div>
    </section>

    <section id="dueSoonSection" class="highlight-section" style="display:none;">
      <h2>⏰ 마감 3일 이내</h2>
      <div id="dueSoonList" class="notice-list"></div>
    </section>

    <h2 id="allList">전체 공고 목록</h2>
    <section class="filters">
      <input id="searchInput" type="text" placeholder="공고명 / 기관명 검색" />
      <select id="typeFilter">
        <option value="">전체 업무구분</option>
        <option value="물품">물품</option>
        <option value="공사">공사</option>
        <option value="용역">용역</option>
      </select>
    </section>

    <section id="noticeList" class="notice-list">
      <!-- app.js가 여기에 공고 카드를 렌더링 -->
      <p class="loading">불러오는 중...</p>
    </section>

    <h2>마감된 공고</h2>
    <section id="closedList" class="notice-list closed-list">
      <p class="empty">마감된 공고가 없습니다.</p>
    </section>
  </main>

  <footer>
    <p>데이터 출처: 나라장터(조달청) 공공데이터포털 오픈API · 10분 간격 자동 갱신</p>
  </footer>

  <div id="detailModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button id="modalClose" class="modal-close" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
